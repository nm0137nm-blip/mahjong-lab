name: P2a-v4.4 GPT-6 pilot46 NEWKEY one approved POST encrypted
# One authorization consumed by successful single Responses POST in run 45216681342.
# Disarmed; direct dispatch also fails explicit approval check.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mahjong-v44-onepost-newkey-pilot46
  cancel-in-progress: false
jobs:
  authorized-newkey-pilot46:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/p2a-v44-original36/independent-requests.json
      V14_V44_QUESTIONS_DIR: /tmp/p2a-v44-public8/questions
      PILOT46_ENCRYPTED_DIR: /tmp/pilot46-newkey-encrypted-only
      ONE_SHOT_APPROVAL: 'EXPIRED_AFTER_SUCCESS_45216681342'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-original36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v44-public-frozen-8-unseen-GPT6-JSON-FILES
          run-id: 45186436930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-public8
      - name: Preflight eight frozen source packets, authorization and encryption without API POST
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          test -s "$V14_V44_QUESTIONS_DIR/pilot-46.json"
          node --test tests/next/v14-v44-api-onecase.test.mjs tests/next/v14-v44-pilot46-single-live-actions.test.mjs
      - name: Send exactly one authorized pilot46 GPT-6 Sol request, no auto retries
        run: |
          set -euo pipefail
          node tests/next/v14-v44-pilot46-single-live-actions.mjs
      - name: Archive encrypted reply and safe receipt without plaintext
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v44-pilot46-newkey-encrypted-only
          path: /tmp/pilot46-newkey-encrypted-only
          retention-days: 7
          if-no-files-found: error
