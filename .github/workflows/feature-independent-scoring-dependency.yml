name: Export independent pinned scoring library
on:
  pull_request:
    branches: [project-handoff]
    paths: ['.github/workflows/feature-independent-scoring-dependency.yml']
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download independent pure Python scoring library
        run: |
          python -m pip download --no-deps --only-binary=:all: 'mahjong==1.4.0' -d /tmp/mahjong-wheel
          sha256sum /tmp/mahjong-wheel/*
      - uses: actions/upload-artifact@v4
        with:
          name: independent-mahjong-scoring-wheel
          path: /tmp/mahjong-wheel/*.whl
          retention-days: 1
