name: First South4 research browser QA
on:
  pull_request:
    branches: [feat/learning-postmatch-research-20261125]
    paths: ['tests/next/alllast-research.cjs','index.html','src/research/alllast-*.mjs','.github/workflows/learning-alllast-research.yml']
permissions:
  contents: read
concurrency:
  group: learning-alllast-research-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install pinned browser test runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          npx playwright install --with-deps chromium webkit
      - name: Verify live app with synthetic data only
        run: |
          set -euo pipefail
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/research-http.log 2>&1 &
          sleep 2
          node tests/next/alllast-research.cjs
