name: Phase 0 automatic evidence freeze and controlled completion
on:
  push:
    branches: [project-handoff]
    paths:
      - handoff/finalize_phase0.py
      - .github/workflows/phase0-finalize.yml
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-handoff
      - name: Wait only for successful margin gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(gh api repos/nm0137nm-blip/mahjong-lab/actions/runs/44680960295 --jq .status)
            if [ "$status" = completed ]; then
              test "$(gh api repos/nm0137nm-blip/mahjong-lab/actions/runs/44680960295 --jq .conclusion)" = success
              exit 0
            fi
            sleep 20
          done
          exit 1
      - name: Verify and archive exact synthetic evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 handoff/finalize_phase0.py
      - name: Save controlled phase close (no deployment)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/ handoff/state.json handoff/formal-protocol-v1.json HANDOFF.md
          git commit -m "Close controlled Phase 0 and freeze verified synthetic evidence"
          git push origin HEAD:project-handoff
