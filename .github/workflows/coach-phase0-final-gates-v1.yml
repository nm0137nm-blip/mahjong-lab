name: Phase 0 original agent action detail audit
on:
  pull_request:
    branches: [feat/coach-phase0-live-variance-v1]
    paths:
      - tests/phase0/**
      - tests/arena/run-phase0-*.cjs
      - .github/workflows/coach-phase0-final-gates-v1.yml
permissions:
  contents: read
  actions: read
jobs:
  live-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        first: [1,2]
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic match environment
        run: |
          set -euo pipefail
          mv lab /tmp/lab
          node --check /tmp/lab/tests/arena/run-phase0-payload.cjs
          node --test /tmp/lab/tests/mortal-cpu.test.mjs
          curl --fail --location --retry 2 --silent --show-error --max-time 160 'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/lab/tests/mortal/model.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/lab/tests/mortal/model.onnx' | sha256sum --check
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          npx playwright install chromium
      - name: Capture actual CPU seat observations and Q in disposable browser
        env:
          COACH_ARENA_QA: '1'
          ARENA_PAIR: ${{ matrix.first }}
        run: |
          set -euo pipefail
          (cd /tmp/lab && python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/http-log 2>&1) &
          sleep 2
          node /tmp/lab/tests/arena/run-phase0-payload.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-${{ matrix.first }}
          path: /tmp/phase0-live/live-*.json
          retention-days: 7
          if-no-files-found: error
  live-native:
    needs: live-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: live-*
          path: /tmp/live
      - name: Prepare pinned original native reference
        run: |
          git clone https://github.com/Equim-chan/Mortal.git /tmp/Mortal
          git -C /tmp/Mortal checkout 0cff2b52982be5b1163aa9a62fb01f03ce91e0d2
          python -m pip install numpy==2.2.6 onnxruntime==1.21.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          cd /tmp/Mortal
          PYO3_PYTHON="$(which python)" cargo build -p libriichi --lib --release --locked
          cp target/release/libriichi.so /tmp/libriichi.so
      - name: Get and verify exact public checkpoints
        run: |
          curl -fL --retry 2 --max-time 240 https://huggingface.co/haor/Mortal-S42/resolve/524981f21a929e3c3b269f65af79b84163bd02ca/weights/s42-inference.pth -o /tmp/s42.pth
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo 'e5f6955b6f19007fd65315e53291b36994493046bc118b991b959e9dc596d660  /tmp/s42.pth' | sha256sum -c -
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
      - name: Compare native feature, masks, original PyTorch and ONNX
        env:
          PYTHONPATH: /tmp
          MORTAL_SOURCE: /tmp/Mortal
          S42_PTH: /tmp/s42.pth
          S42_ONNX: /tmp/s42.onnx
        run: python tests/phase0/native-agent-audit.py /tmp/live /tmp/agent-detail-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-agent-detail-summary
          path: /tmp/agent-detail-summary.json
          retention-days: 30
