name: P2a-v4.4 ONE-TIME authorized GPT-6 pilot-46 (encrypted evidence)
# The approved one-shot API POST was attempted once (run 45203665432; HTTP 429).
# This workflow is now inert: no push trigger and its consent value is invalid.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mahjong-p2a-v44-onetime-pilot46-approval
  cancel-in-progress: false
jobs:
  authorized-private-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/p2a-v44-original36/independent-requests.json
      V14_V44_QUESTIONS_DIR: /tmp/p2a-v44-public8/questions
      PILOT46_ENCRYPTED_DIR: /tmp/mahjong-pilot46-encrypted
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ONE_SHOT_APPROVAL: 'EXPIRED_AFTER_SINGLE_429_ATTEMPT'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-original36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v44-public-frozen-8-unseen-GPT6-JSON-FILES
          run-id: 45186436930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-public8
      - name: Verify original public data and encryption, refuse rerun or wrong branch
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          test -s "$V14_V44_QUESTIONS_DIR/pilot-46.json"
          node --test tests/next/v14-v44-api-onecase.test.mjs tests/next/v14-v44-pilot46-single-live-actions.test.mjs
      - name: Run EXACTLY ONE preapproved $0.30-max GPT-6 Sol request
        run: |
          set -euo pipefail
          node tests/next/v14-v44-pilot46-single-live-actions.mjs
      - name: Archive RSA encrypted raw reply and safe sanitized summary (never plaintext)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v44-pilot46-encrypted-original-one-attempt
          path: /tmp/mahjong-pilot46-encrypted
          retention-days: 7
          if-no-files-found: error
