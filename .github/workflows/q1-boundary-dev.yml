name: Q1 bounded development GRP audit
on:
  pull_request:
    branches: [project-handoff]
    paths: ['handoff/q1/**','.github/workflows/q1-boundary-dev.yml']
permissions:
  contents: read
  actions: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 scikit-learn==1.6.1
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python handoff/q1/boundary_dev.py
      - uses: actions/upload-artifact@v4
        with:
          name: q1-boundary-aggregate-only
          path: q1-result.json
          if-no-files-found: error
          retention-days: 30
