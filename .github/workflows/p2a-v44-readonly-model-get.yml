name: P2a-v4.4 ONE-TIME zero-cost GET model permissions only
on:
  push:
    branches:
      - feat/coach-p2a-v44-api-transport-dryrun
    paths:
      - research/approvals/read-only-model-get-20261124.run
permissions:
  contents: read
jobs:
  model-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Dry tests first; no billable model requests
        run: node --test tests/next/v14-v44-free-model-readcheck.test.mjs
      - name: GET one model's metadata, no generation or token cost
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/next/v14-v44-free-model-readcheck.mjs
