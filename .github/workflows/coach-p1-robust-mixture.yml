name: P1 robust cross-family mixture development diagnostic
on:
  pull_request:
    branches: [feat/coach-p1-augmented-threefamily-v1]
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: 6f58994e77131713c1ecd8e0dfb8fe80b1eb9e80
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: multifamily-dev-*
          run-id: 44693828778
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/multi
      - uses: actions/download-artifact@v4
        with:
          pattern: self-opponent-dev-*
          run-id: 44702128580
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/self
      - run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 lightgbm==4.6.0 scikit-learn==1.8.0 requests==2.32.5
          cp -r frozen/archive/versions/belief-120-ab-v1 /tmp/belief-model
          python lab/tests/next/p1-robust-mixture.py /tmp/multi /tmp/self
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: p1-robust-mixture
          path: /tmp/p1-threefamily-screen.json
          if-no-files-found: error
          retention-days: 30
