name: Full extension metadata audit
on:
  pull_request:
    branches: [project-handoff]
    paths: ['handoff/learning-extension-status.py','.github/workflows/learning-extension-status.yml']
permissions:
  contents: read
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Audit existing archives and all repair artifacts (no decryption)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 handoff/learning-extension-status.py
