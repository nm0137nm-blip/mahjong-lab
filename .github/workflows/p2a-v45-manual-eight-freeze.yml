name: P2a-v45 manual eight frozen public prompts and zero-cost QA
on:
  push:
    branches:
      - feat/coach-p2a-v45-japanese-reversal-lexemes
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze-v45-original-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/p2a-v45-source36/independent-requests.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v45-source36
      - name: All existing v45 prospective unit and original-source freeze tests
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          node --test tests/next/v14-v45-japanese-condition.test.mjs tests/next/v14-v45-stage1-freeze.test.mjs
      - name: Freeze eight unexposed public-only question JSON without API model calls
        run: |
          set -euo pipefail
          node tests/next/v14-v45-stage1-freeze.mjs "$V14_FOLLOWUP_PUBLIC" /tmp/v45-frozen
          test -s /tmp/v45-frozen/public/questions/pilot-41.json
          test -s /tmp/v45-frozen/verifier/manifest.json
      - name: Upload PUBLIC question files and public frozen SHA manifest only
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v45-manual-eight-frozen-public-only-json
          path: /tmp/v45-frozen/public
          retention-days: 30
      - run: echo "No GPT model calls, no API credits, no hidden hands or S42; private controls omitted from artifact."
