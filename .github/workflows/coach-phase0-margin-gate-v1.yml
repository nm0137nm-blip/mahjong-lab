name: Phase 0 measured margin and repeated execution gate
on:
  pull_request:
    branches: [feat/coach-phase0-release-prep-v1]
permissions:
  contents: read
  actions: read
jobs:
  browser-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        replicate: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: s42-synthetic-reference
          run-id: 44667625456
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ref
      - uses: actions/download-artifact@v4
        with:
          name: corrected-encoder
          run-id: 44673093075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/fixed
      - shell: bash
        run: |
          set -euo pipefail
          cp /tmp/fixed/encoder-pkg/encoder* assets/mortal/
          echo '0e9dcc57545afb5769d42f372bbd82be5c26941d1e352245b225d62ce0c611bf  assets/mortal/encoder_bg.wasm' | sha256sum -c -
          node tests/mortal/q-parity-fixtures.mjs /tmp/corrected-scenes.json
          node --input-type=module -e 'import fs from "fs";import assert from "assert/strict";let r=JSON.parse(fs.readFileSync("/tmp/ref/s42-q-reference.json"));let s=JSON.parse(fs.readFileSync("/tmp/corrected-scenes.json")).flatMap(x=>x.decisions.map(d=>({name:x.name,eventIndex:d.eventIndex,raw:d.raw})));assert.deepEqual(s,r.map(({name,eventIndex,raw})=>({name,eventIndex,raw})));console.log("Corrected WASM observations and masks bit-identical on 100 calibration fixtures")'
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
          node --input-type=module -e 'import http from "node:http"; import fs from "node:fs"; import path from "node:path"; http.createServer((req,res)=>{const p=path.resolve("."+new URL(req.url,"http://localhost").pathname);if(!p.startsWith(process.cwd()+"/")){res.writeHead(404);res.end();return;} const ext=path.extname(p);res.setHeader("Content-Type",({".mjs":"text/javascript",".js":"text/javascript",".wasm":"application/wasm",".html":"text/html"})[ext]||"application/octet-stream");const stream=fs.createReadStream(p);stream.on("error",()=>{res.statusCode=404;res.end();});stream.pipe(res);}).listen(8765,"127.0.0.1")' >/tmp/s42-audit-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          mkdir -p /tmp/browser
          engine='${{ matrix.engine }}'; rep='${{ matrix.replicate }}'
          # Each replicate runs in a fresh runner/container. At most 3 startup attempts.
          # A numerical/mask failure is never retried. Preserve initialization failures.
          attempt=1
          while true; do
            set +e
            timeout 90s node tests/phase0/repeat-q-browser.mjs /tmp/s42.onnx /tmp/ref/s42-q-reference.json "$engine" "/tmp/browser/browser-$engine-$rep.json" 2>&1 | tee "/tmp/browser/startup-$engine-$rep-$attempt.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" = 0 ]; then break; fi
            if [ "$rc" != 42 ] || [ "$attempt" -ge 3 ]; then exit "$rc"; fi
            attempt=$((attempt+1))
            sleep 2
          done
          printf '{"engine":"%s","replicate":%s,"attempts":%s,"startup_failures":%s}\n' "$engine" "$rep" "$attempt" "$((attempt-1))" > "/tmp/browser/startup-$engine-$rep.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: margin-browser-${{ matrix.engine }}-${{ matrix.replicate }}-calibration
          path: /tmp/browser/
          if-no-files-found: error
          retention-days: 30
  cpu-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: s42-synthetic-reference
          run-id: 44667625456
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ref
      - run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 onnxruntime==1.21.0
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
          python tests/phase0/repeat-q-cpu.py /tmp/ref/s42-q-reference.json /tmp/s42.onnx /tmp/cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: margin-cpu-calibration
          path: /tmp/cpu.json
          if-no-files-found: error
          retention-days: 30
  freeze-threshold:
    needs: [browser-calibration,cpu-calibration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: s42-synthetic-reference
          run-id: 44667625456
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/ref
      - uses: actions/download-artifact@v4
        with:
          pattern: margin-*-calibration
          path: /tmp/cal
      - run: python3 tests/phase0/freeze-q-margin.py /tmp/ref/s42-q-reference.json /tmp/cal /tmp/margin.json
      - uses: actions/upload-artifact@v4
        with:
          name: margin-frozen-threshold
          path: /tmp/margin.json
          if-no-files-found: error
          retention-days: 30
  native-margin-gate:
    needs: freeze-threshold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: margin-frozen-threshold
          path: /tmp/threshold
      - uses: actions/download-artifact@v4
        with:
          pattern: live-[12]
          run-id: 44673238225
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/live
      - name: Prepare pinned original native reference
        run: |
          git clone https://github.com/Equim-chan/Mortal.git /tmp/Mortal
          git -C /tmp/Mortal checkout 0cff2b52982be5b1163aa9a62fb01f03ce91e0d2
          python -m pip install numpy==2.2.6 onnxruntime==1.21.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          cd /tmp/Mortal
          PYO3_PYTHON="$(which python)" cargo build -p libriichi --lib --release --locked
          cp target/release/libriichi.so /tmp/libriichi.so
      - name: Get and verify exact public checkpoints
        run: |
          curl -fL --retry 2 --max-time 240 https://huggingface.co/haor/Mortal-S42/resolve/524981f21a929e3c3b269f65af79b84163bd02ca/weights/s42-inference.pth -o /tmp/s42.pth
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo 'e5f6955b6f19007fd65315e53291b36994493046bc118b991b959e9dc596d660  /tmp/s42.pth' | sha256sum -c -
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
      - name: Compare native feature, masks, original PyTorch and ONNX
        env:
          PYTHONPATH: /tmp
          MORTAL_SOURCE: /tmp/Mortal
          S42_PTH: /tmp/s42.pth
          S42_ONNX: /tmp/s42.onnx
        run: python tests/phase0/native-agent-margin.py /tmp/live /tmp/margin-final.json /tmp/threshold/margin.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-margin-final
          path: /tmp/margin-final.json
          retention-days: 30
          if-no-files-found: error
