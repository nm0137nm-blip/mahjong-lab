name: P2a-v46 full typed-condition contract offline regressions
on:
  push:
    branches:
      - feat/coach-p2a-v46-structured-condition-prototype
    paths:
      - 'src/coach/*v46*.mjs'
      - 'tests/next/*v46*.test.mjs'
      - '.github/workflows/p2a-v46-full-contract.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/v46-public36/independent-requests.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-public36
      - run: |
          set -euo pipefail
          node --test tests/next/v14-structured-condition-v46.test.mjs tests/next/v14-v46-structured-contract.test.mjs tests/next/v14-v45-japanese-condition.test.mjs tests/next/v14-v45-stage1-freeze.test.mjs tests/next/v14-v45-stage1-receipt.test.mjs
      - run: echo 'Zero inference; no genuine model answers regraded, no tactical certification.'
