name: P2a-v4.2 typed seat + logged transport research fix (new first pilot52)
on:
  push:
    branches:
      - feat/coach-p2a-v42-typed-seat-transport
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pre-model-contract-and-public-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v42-original36
      - name: Assert original source exists and test v4, v41 and v42 validators without independent model calls
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/p2a-v42-original36/independent-requests.json
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          node --test tests/next/v14-anchored-tactical-text-v4.test.mjs tests/next/v14-anchored-tactical-text-v41.test.mjs tests/next/v14-v41-stage1-freeze.test.mjs tests/next/v14-v41-evaluation-plan.test.mjs tests/next/v14-v42-numeric-and-transport.test.mjs tests/next/v14-source-comparison-proof-v4.test.mjs
      - name: Generate versioned pilot52-first public questions and separate sealed weak control map
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/p2a-v42-original36/independent-requests.json
        run: |
          set -euo pipefail
          node tests/next/v14-v42-stage1-freeze.mjs "$V14_FOLLOWUP_PUBLIC" /tmp/p2a-v42-frozen
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-v42-public-8-unseen-first-pilot52
          path: /tmp/p2a-v42-frozen/public/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-v42-sealed-weak-control-verifier-only
          path: /tmp/p2a-v42-frozen/verifier/
          retention-days: 30
          if-no-files-found: error
      - run: echo 'No actual v42 independent ChatGPT answers, no API paid; previous NO-GO historical records unmodified.'
