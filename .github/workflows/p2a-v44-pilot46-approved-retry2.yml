name: P2a-v4.4 GPT-6 pilot46 retry2 APPROVED one POST encrypted
# Inert after attempted API POST #45210322937 (429 billing_not_active). No live push trigger.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p2a-v44-pilot46-approved-retry2-single-post
  cancel-in-progress: false
jobs:
  single-approved-pilot46:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/p2a-v44-original36/independent-requests.json
      V14_V44_QUESTIONS_DIR: /tmp/p2a-v44-public8/questions
      PILOT46_ENCRYPTED_DIR: /tmp/pilot46-encrypted-retry2
      ONE_SHOT_APPROVAL: 'EXPIRED_AFTER_BILLING_NOT_ACTIVE_429'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-original36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v44-public-frozen-8-unseen-GPT6-JSON-FILES
          run-id: 45186436930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-public8
      - name: Verify source, prior approval guard, encryption and fixed token cap offline
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          test -s "$V14_V44_QUESTIONS_DIR/pilot-46.json"
          node --test tests/next/v14-v44-api-onecase.test.mjs tests/next/v14-v44-pilot46-single-live-actions.test.mjs tests/next/v14-v44-free-model-readcheck.test.mjs
      - name: Execute only one pilot46 GPT-6 Sol Responses POST; log safe 429 code if failed
        run: |
          set -euo pipefail
          node tests/next/v14-v44-pilot46-single-live-actions.mjs
      - name: Archive ciphertext and sanitized receipt only, no original response text
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v44-pilot46-retry2-encrypted-only
          path: /tmp/pilot46-encrypted-retry2
          retention-days: 7
          if-no-files-found: error
