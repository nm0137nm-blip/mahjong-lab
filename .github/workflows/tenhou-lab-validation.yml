name: Tenhou LAB rule and UI validation
on:
  pull_request:
    branches: [main]
    paths: ['index.html','tests/**','service-worker.js','.github/workflows/tenhou-lab-validation.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs tests/mortal/*.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lab-http.log 2>&1 &
          sleep 2
          BROWSER=chromium node tests/mobile-smoke.mjs
          node tests/tenhou-profile-browser.mjs
  complete_match:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real model through complete East and Hanchan, offline restoration
        run: |
          set -euo pipefail
          mv lab /tmp/lab
          curl --fail --location --retry 1 --silent --show-error --max-time 160 'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/lab/tests/mortal/model.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/lab/tests/mortal/model.onnx' | sha256sum -c -
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright-core@1.57.0 >/dev/null
          (cd /tmp/lab && python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/http.log 2>&1) &
          sleep 2
          node /tmp/lab/tests/mortal/run-full-match-probe.cjs
