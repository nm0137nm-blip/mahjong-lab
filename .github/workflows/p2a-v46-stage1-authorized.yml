name: P2a-v46 Stage1 authorized API eight capped
# One-shot authorization closed; reruns and dispatch blocked.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mahjong-v46-stage1-one-time-20261124
  cancel-in-progress: false
jobs:
  eight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V46_SOURCE: /tmp/v46-verifier/independent-requests.json
      V46_QUESTIONS: /tmp/v46-public/questions
      V46_STAGE1_OUT: /tmp/v46-stage1-encrypted
      V46_STAGE1_APPROVAL: EXPIRED_AFTER_PILOT82_INCOMPLETE
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-public-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-public
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-verifier-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-verifier
      - run: node --test tests/next/v14-v46-frozen-receipt.test.mjs tests/next/v14-v46-stage1-capped.test.mjs
      - run: node tests/next/v14-v46-stage1-capped.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2a-v46-stage1-api-encrypted-evidence
          path: /tmp/v46-stage1-encrypted
          retention-days: 7
          if-no-files-found: ignore
