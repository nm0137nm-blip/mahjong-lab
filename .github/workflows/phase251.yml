name: Mahjong LAB phase 2.5.1 validation
on:
  push:
    branches:
      - fix/phase-2-5-feedback-20261118
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: |
          node --check src/mortal/mortal-client.mjs
          node --check src/mortal/mortal-worker.mjs
          node --check src/mortal/s42-analytics.mjs
          node --check src/mortal/mjai-bridge.mjs
          node --check service-worker.js
