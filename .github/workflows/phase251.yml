name: Mahjong LAB mobile and S42 regression
on:
  push:
    branches:
      - fix/phase252-safari-s42-20261118
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs tests/mortal/*.test.mjs
      - run: |
          node --check src/mortal/sha256.mjs
          node --check src/mortal/mortal-client.mjs
          node --check src/mortal/mortal-worker.mjs
          node --check src/mortal/s42-analytics.mjs
          node --check src/mortal/mjai-bridge.mjs
          node --check service-worker.js
  mobile-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Download and SHA-256 verify actual S42 weights (CI only)
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
            'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx?download=true' \
            --output /tmp/mortal-s42-model.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/mortal-s42-model.onnx' | sha256sum -c -
      - name: Real-model browser smoke (mobile WebKit)
        run: |
          node --input-type=module -e 'import http from "node:http"; import fs from "node:fs"; import path from "node:path"; http.createServer((req,res)=>{let p=path.resolve("."+new URL(req.url,"http://localhost").pathname);if(p===process.cwd())p+="/index.html";if(!p.startsWith(process.cwd()+"/")){res.writeHead(404);res.end();return;}res.setHeader("Content-Type",({".mjs":"text/javascript",".js":"text/javascript",".wasm":"application/wasm",".html":"text/html",".svg":"image/svg+xml",".png":"image/png"})[path.extname(p)]||"application/octet-stream");const stream=fs.createReadStream(p);stream.on("error",()=>{res.statusCode=404;res.end();});stream.pipe(res);}).listen(8765,"127.0.0.1")' >/tmp/mahjong-lab-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && break
            sleep 1
          done
          BROWSER=webkit S42_MODEL_TEST=1 S42_LOCAL_MODEL=/tmp/mortal-s42-model.onnx node tests/mobile-smoke.mjs
          BROWSER=chromium LEGACY_CACHE_TEST=1 S42_MODEL_TEST=1 S42_LOCAL_MODEL=/tmp/mortal-s42-model.onnx node tests/mobile-smoke.mjs
