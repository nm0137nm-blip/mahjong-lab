name: P2a-v45 Stability authorized eight GPT6 Sol API at most 5 cents per call
# Authorization closed after first fatal, run 45302765123.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mahjong-v45-stability-one-time-authorized-marker
  cancel-in-progress: false
jobs:
  eight-sequential:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/v45-stability-original/independent-requests.json
      V45_QUESTIONS: /tmp/v45-stability-questions/questions
      V45_STABILITY_OUT: /tmp/v45-stability-encrypted
      V45_STABILITY_APPROVAL: EXPIRED_AFTER_FIRST_FATAL_PILOT54_R1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v45-stability-original
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v45-manual-eight-frozen-public-only-json
          run-id: 45280357883
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v45-stability-questions
      - name: Verify original prompt identity and budget and approval guard unit tests
        run: |
          set -euo pipefail
          node --test tests/next/v14-v45-stability-capped.test.mjs
      - name: At most eight approved calls with fixed order and no retries
        run: node tests/next/v14-v45-stability-capped.mjs
      - name: Preserve encrypted originals and sanitized cost receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v45-stability-encrypted-evidence
          path: /tmp/v45-stability-encrypted
          retention-days: 7
          if-no-files-found: ignore
