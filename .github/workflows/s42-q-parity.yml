name: S42 numerical parity audit (synthetic data only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/mortal/**'
      - 'tests/mortal/q-parity*'
      - '.github/workflows/s42-q-parity.yml'
      - 'assets/mortal/**'
      - 'assets/ort/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate fictional event streams and actual deployed WASM observations
        run: node tests/mortal/q-parity-fixtures.mjs /tmp/s42-scenes.json
      - name: Prepare pinned original native reference
        run: |
          git clone https://github.com/Equim-chan/Mortal.git /tmp/Mortal
          git -C /tmp/Mortal checkout 0cff2b52982be5b1163aa9a62fb01f03ce91e0d2
          python -m pip install numpy==2.2.6 onnxruntime==1.21.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          cd /tmp/Mortal
          PYO3_PYTHON="$(which python)" cargo build -p libriichi --lib --release --locked
          cp target/release/libriichi.so /tmp/libriichi.so
      - name: Get and verify exact public checkpoints
        run: |
          curl -fL --retry 2 --max-time 240 https://huggingface.co/haor/Mortal-S42/resolve/524981f21a929e3c3b269f65af79b84163bd02ca/weights/s42-inference.pth -o /tmp/s42.pth
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo 'e5f6955b6f19007fd65315e53291b36994493046bc118b991b959e9dc596d660  /tmp/s42.pth' | sha256sum -c -
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
      - name: Compare native feature, masks, original PyTorch and ONNX
        env:
          PYTHONPATH: /tmp
          MORTAL_SOURCE: /tmp/Mortal
          S42_PTH: /tmp/s42.pth
          S42_ONNX: /tmp/s42.onnx
        run: python tests/mortal/q-parity-reference.py /tmp/s42-scenes.json /tmp/s42-q-reference.json
      - name: Install mobile WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Compare deployed browser worker against original PyTorch inference
        run: |
          python -m http.server 8765 >/tmp/s42-audit-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/mortal/q-parity-browser.mjs /tmp/s42.onnx /tmp/s42-q-reference.json
