name: 麻雀LAB P2a-v3 dev proof (public source, no paid model)
on:
  push:
    branches:
      - feat/coach-p2a-v3-contract-repair
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v3-public-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-new36
      - name: Test distinct versioned Stage1 candidate contrast without running any model
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/v3-new36/independent-requests.json
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          node --test tests/next/v14-evidence-proof-v3.test.mjs

  v3-stage2-unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: v14-frozen-stage1-only
          run-id: 44813180639
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-old30
      - uses: actions/download-artifact@v4
        with:
          name: v14-frozen-verifier-only
          run-id: 44813180639
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-verifier
      - uses: actions/download-artifact@v4
        with:
          name: v14-contrast-mortal-verifier-only
          run-id: 44813459829
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-model-verifier
      - name: Test identical Stage2 genuine and isolated fake answer contract; never call any LLM
        env:
          V14_STAGE1: /tmp/v3-old30/independent-requests.json
          V14_LINEAGE: /tmp/v3-verifier/lineage.json
          V14_PINNED_CONTRAST: /tmp/v3-model-verifier/contrast-mortal-result.json
        run: |
          set -euo pipefail
          test -s "$V14_PINNED_CONTRAST"
          node --test tests/next/v14-stage2-unified-v3.test.mjs

  v3-chatgpt-manual-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-new36
      - name: Validate pre-registered frozen eight public prompts and old-version request rejection
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/v3-new36/independent-requests.json
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          node --test tests/next/v14-freeze-v3-manual-smoke.test.mjs tests/next/v14-pilot48-format-fix-v3.test.mjs
          node tests/next/v14-freeze-v3-manual-smoke.mjs "$V14_FOLLOWUP_PUBLIC" /tmp/v3-chatgpt-manual-smoke
      - name: Freeze human-use files without model answers or teacher reference
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v3-chatgpt-8x3-manual-readable-schema-v3
          path: /tmp/v3-chatgpt-manual-smoke/
          if-no-files-found: error
          retention-days: 30

  v3-candidate-own-value-vs-opponent-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-new36
      - name: Generate candidate-specific public winning scores and opponent comparison for 36 distinct dev cases
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/v3-new36/independent-requests.json
          V14_V3_CANDIDATE_TABLE_OUTPUT: /tmp/v3-conditional-value-tables.json
        run: |
          set -euo pipefail
          node --test tests/next/v14-conditional-table-v3.test.mjs
          python tests/next/audit-v14-conditional-table-v3.py \
            "$V14_FOLLOWUP_PUBLIC" "$V14_V3_CANDIDATE_TABLE_OUTPUT" \
            /tmp/v3-conditional-value-independent-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-v3-public-candidate-value-and-independent-audit-no-ev
          path: |
            /tmp/v3-conditional-value-tables.json
            /tmp/v3-conditional-value-independent-audit.json
          if-no-files-found: error
          retention-days: 30

  v3-public-multi-axis-pair-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-new36
      - name: Check score and public history accounting on 8 unlabelled paired variations
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/v3-new36/independent-requests.json
        run: |
          set -euo pipefail
          node --test tests/next/v14-public-counterfactual-prep-v3.test.mjs tests/next/v14-public-counterfactual-extension-v3.test.mjs

  v3-s42-paired-public-reference:
    if: false # actual S42 8-pair reference frozen in completed run 45102049118; do not rerun on unrelated commits
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install onnxruntime==1.22.1 numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: corrected-encoder
          run-id: 44673093075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/fixed-encoder
      - name: Reinstall pinned legal S42 observation encoder and pinned model (no paid API)
        run: |
          set -euo pipefail
          cp /tmp/fixed-encoder/encoder-pkg/encoder* assets/mortal/
          echo '886cb7abb09034dcdf348039d651d63a83cd7edb87d3337a452722c960b9d97a  assets/mortal/encoder.js' | sha256sum -c -
          echo '0e9dcc57545afb5769d42f372bbd82be5c26941d1e352245b225d62ce0c611bf  assets/mortal/encoder_bg.wasm' | sha256sum -c -
          curl --fail --location --retry 2 --silent --show-error --max-time 160 \
            'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/mortal.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/mortal.onnx' | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-new36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-verifier-only-development
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-verifier
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-v2-dev-data-*
          run-id: 44726204303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v14-dev
      - name: Independently re-encode only focal visible histories, remove other hidden hands, evaluate actual S42
        run: |
          set -euo pipefail
          node tests/next/v14-v3-s42-paired-encode.mjs \
            /tmp/v3-new36/independent-requests.json /tmp/v3-verifier/lineage.json \
            /tmp/v14-dev /tmp/v3-public-pairs-obs
          python tests/next/v14-v3-s42-paired-grade.py \
            /tmp/v3-public-pairs-obs /tmp/mortal.onnx /tmp/v3-s42-public-pairs-result.json
      - if: always()
        run: rm -rf /tmp/v3-public-pairs-obs /tmp/v14-dev /tmp/mortal.onnx /tmp/fixed-encoder
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-v3-8-public-counterfactual-s42-verifier-only
          path: /tmp/v3-s42-public-pairs-result.json
          if-no-files-found: error
          retention-days: 30

  v3-s42-paired-public-reference-expansion:
    if: false # exploratory extension fixed in successful run 45105529039; prevent re-running on unrelated edits
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install onnxruntime==1.22.1 numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          name: corrected-encoder
          run-id: 44673093075
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/fixed-encoder
      - name: Reinstall SHA-pinned observation encoder before source reconstruction
        run: |
          set -euo pipefail
          cp /tmp/fixed-encoder/encoder-pkg/encoder* assets/mortal/
          echo '886cb7abb09034dcdf348039d651d63a83cd7edb87d3337a452722c960b9d97a  assets/mortal/encoder.js' | sha256sum -c -
          echo '0e9dcc57545afb5769d42f372bbd82be5c26941d1e352245b225d62ce0c611bf  assets/mortal/encoder_bg.wasm' | sha256sum -c -
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-new36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-verifier-only-development
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v3-verifier
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-v2-dev-data-*
          run-id: 44726204303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v14-dev
      - name: Independently re-encode additional source-disjoint exploratory public pairs and pinned S42
        env:
          V14_PAIR_BATCH: expansion
        run: |
          set -euo pipefail
          node tests/next/v14-v3-s42-paired-encode.mjs \
            /tmp/v3-new36/independent-requests.json /tmp/v3-verifier/lineage.json \
            /tmp/v14-dev /tmp/v3-public-pairs-obs
      - name: Obtain exact SHA-pinned S42 ONNX after all source observables validate
        run: |
          set -euo pipefail
          if ! curl --fail --location --http1.1 --retry-all-errors --retry 1 --retry-delay 3 --silent --show-error --max-time 90 \
            'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/mortal.onnx; then
            rm -f /tmp/mortal.onnx
            curl --fail --location --http1.1 --retry-all-errors --retry 3 --retry-delay 4 --silent --show-error --max-time 150 \
              'https://hf-mirror.com/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/mortal.onnx
          fi
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/mortal.onnx' | sha256sum -c -
      - name: Run S42 on pre-encoded redacted observations only
        run: |
          set -euo pipefail
          python tests/next/v14-v3-s42-paired-grade.py \
            /tmp/v3-public-pairs-obs /tmp/mortal.onnx /tmp/v3-s42-public-pairs-result.json
      - if: always()
        run: rm -rf /tmp/v3-public-pairs-obs /tmp/v14-dev /tmp/mortal.onnx /tmp/fixed-encoder
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-v3-expanded-source-disjoint-s42-verifier-only
          path: /tmp/v3-s42-public-pairs-result.json
          if-no-files-found: error
          retention-days: 30
