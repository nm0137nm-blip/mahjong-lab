name: Calculation training QA
on:
  pull_request:
    branches: [feat/learning-alllast-research-20261125]
    paths: ['src/research/training-core.mjs','calculation-training.html','tests/next/training-*','.github/workflows/learning-training.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Independent arithmetic and session tests
        run: node --test tests/next/training-core.test.mjs
      - name: Install browser runtime
        run: |
          mkdir -p /tmp/probe
          cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          npx playwright install --with-deps chromium webkit
      - name: Verify training UI
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/training-http.log 2>&1 &
          sleep 2
          node tests/next/training-browser.cjs
