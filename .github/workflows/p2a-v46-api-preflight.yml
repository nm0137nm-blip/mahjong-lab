name: P2a-v46 Stage1 offline API transport preflight
on:
  push:
    branches: [feat/coach-p2a-v46-api-capped]
    paths:
      - '.github/workflows/p2a-v46-api-preflight.yml'
      - 'tests/next/v14-v46-stage1-capped*'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      V46_SOURCE: /tmp/v46-verifier/independent-requests.json
      V46_QUESTIONS: /tmp/v46-public/questions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-public-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-public
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-verifier-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-verifier
      - run: node --test tests/next/v14-v46-frozen-receipt.test.mjs tests/next/v14-v46-stage1-capped.test.mjs
