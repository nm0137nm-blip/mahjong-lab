name: P2a-v4.4 GPT-6 API transport DRY RUN (no API, no cost)
on:
  push:
    branches:
      - feat/coach-p2a-v44-api-transport-dryrun
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-eight-one-shot-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-original36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v44-public-frozen-8-unseen-GPT6-JSON-FILES
          run-id: 45186436930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-v44-public8
      - name: Test original verifier transport, eight fixed packets, and fail-closed behavior
        env:
          V14_FOLLOWUP_PUBLIC: /tmp/p2a-v44-original36/independent-requests.json
          V14_V44_QUESTIONS_DIR: /tmp/p2a-v44-public8/questions
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          test -s "$V14_V44_QUESTIONS_DIR/pilot-46.json"
          node --test tests/next/v14-v44-api-onecase.test.mjs
          node tests/next/v14-v44-api-onecase.mjs \
            --mode=dry-run \
            --case=pilot-46 \
            --question="$V14_V44_QUESTIONS_DIR/pilot-46.json" \
            --frozen="$V14_FOLLOWUP_PUBLIC"
      - run: echo "No API key used. No model execution. No billable network request. Manual v4.4 Stage1 official denominator unchanged."
