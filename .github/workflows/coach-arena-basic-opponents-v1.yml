name: Coach arena - learned and S42 vs standard CPU
on:
  pull_request:
    branches: [feat/coach-arena-basicopp-v2]
    paths:
      - tests/arena/**
      - .github/workflows/coach-arena-basic-opponents-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: coach-arena-basic-opponents-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/coach-arena-basic-opponents-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        first: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: lab
      - uses: actions/download-artifact@v4
        with:
          name: arena-frozen-200-policy
          path: /tmp/arena-model
          run-id: '44516873939'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install verified runtimes
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 lightgbm==4.6.0 scikit-learn==1.8.0
          mv lab /tmp/lab
          node --check /tmp/lab/tests/arena/run-arena.cjs
          node --test /tmp/lab/tests/mortal-cpu.test.mjs
          curl --fail --location --retry 2 --silent --show-error --max-time 160 'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/lab/tests/mortal/model.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/lab/tests/mortal/model.onnx' | sha256sum --check
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          npx playwright install chromium
          cp /tmp/lab/index.html /tmp/arena-original-index
          cp /tmp/lab/src/coach/phoenix-coach.mjs /tmp/arena-original-coach
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/arena-model')
          expected={'pure':'b4ff0a420061b1202e0d7717c7cdea4d6ef7ac0971fff45e0e70f1a49da8edd8','reaction':'11d5699e20319f23040a9e7584e25179615ca8228089de0dce38c527dd7aa42f','special':'0617e41120d1918d69302bf564d294659692e4c35d2a8015c162d003b94a2ff5'}
          freeze=json.loads((root/'freeze.json').read_text())
          for k,v in expected.items():
              assert freeze['models'][k]['byte_parity'] and hashlib.sha256((root/f'{k}.lgb').read_bytes()).hexdigest()==v
          PY
      - name: Run fixed starting-seed pairs
        env:
          COACH_ARENA_QA: '1'
          ARENA_FIRST: ${{ matrix.first }}
          ARENA_COUNT: '1'
        run: |
          set -euo pipefail
          (cd /tmp/lab && python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/http-log 2>&1) &
          sleep 2
          for ((p=ARENA_FIRST;p<ARENA_FIRST+ARENA_COUNT;p++)); do
            cp /tmp/arena-original-index /tmp/lab/index.html
            cp /tmp/arena-original-coach /tmp/lab/src/coach/phoenix-coach.mjs
            ARENA_PAIR="$p" node /tmp/lab/tests/arena/run-arena.cjs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: basicopp-smoke-${{ matrix.first }}
          retention-days: 30
          path: /tmp/arena-results/paired-*.json
  smoke-gate:
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: basicopp-smoke-*
          path: /tmp/arena-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install numpy==2.3.5
          python tests/arena/evaluate-basic-opponents.py smoke /tmp/arena-smoke
  prospective:
    needs: smoke-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        first: [6, 11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86, 91, 96, 101]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: lab
      - uses: actions/download-artifact@v4
        with:
          name: arena-frozen-200-policy
          path: /tmp/arena-model
          run-id: '44516873939'
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install verified runtimes
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 lightgbm==4.6.0 scikit-learn==1.8.0
          mv lab /tmp/lab
          node --check /tmp/lab/tests/arena/run-arena.cjs
          node --test /tmp/lab/tests/mortal-cpu.test.mjs
          curl --fail --location --retry 2 --silent --show-error --max-time 160 'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/lab/tests/mortal/model.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/lab/tests/mortal/model.onnx' | sha256sum --check
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          npx playwright install chromium
          cp /tmp/lab/index.html /tmp/arena-original-index
          cp /tmp/lab/src/coach/phoenix-coach.mjs /tmp/arena-original-coach
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/arena-model')
          expected={'pure':'b4ff0a420061b1202e0d7717c7cdea4d6ef7ac0971fff45e0e70f1a49da8edd8','reaction':'11d5699e20319f23040a9e7584e25179615ca8228089de0dce38c527dd7aa42f','special':'0617e41120d1918d69302bf564d294659692e4c35d2a8015c162d003b94a2ff5'}
          freeze=json.loads((root/'freeze.json').read_text())
          for k,v in expected.items():
              assert freeze['models'][k]['byte_parity'] and hashlib.sha256((root/f'{k}.lgb').read_bytes()).hexdigest()==v
          PY
      - name: Run fixed starting-seed pairs
        env:
          COACH_ARENA_QA: '1'
          ARENA_FIRST: ${{ matrix.first }}
          ARENA_COUNT: '5'
        run: |
          set -euo pipefail
          (cd /tmp/lab && python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/http-log 2>&1) &
          sleep 2
          for ((p=ARENA_FIRST;p<ARENA_FIRST+ARENA_COUNT;p++)); do
            cp /tmp/arena-original-index /tmp/lab/index.html
            cp /tmp/arena-original-coach /tmp/lab/src/coach/phoenix-coach.mjs
            ARENA_PAIR="$p" node /tmp/lab/tests/arena/run-arena.cjs
          done
      - uses: actions/upload-artifact@v4
        with:
          name: basicopp-prospective-${{ matrix.first }}
          retention-days: 30
          path: /tmp/arena-results/paired-*.json
  summarize:
    needs: prospective
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: basicopp-prospective-*
          path: /tmp/arena-prospective
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Summarize all 100 assigned seed pairs
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5
          python tests/arena/evaluate-basic-opponents.py prospective /tmp/arena-prospective | tee /tmp/basicopp-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: basicopp-fixed-100-results
          retention-days: 30
          path: /tmp/basicopp-results.json
