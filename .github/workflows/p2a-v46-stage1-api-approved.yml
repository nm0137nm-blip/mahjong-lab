name: P2a-v46 Stage1 eight API only approved one-shot
# Authorization closed after first fatal in run 45319407857.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mahjong-v46-stage1-api-one-time-20261124
  cancel-in-progress: false
jobs:
  capped-eight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/v46-verifier/independent-requests.json
      V46_QUESTIONS: /tmp/v46-public/questions
      V46_STAGE1_OUT: /tmp/v46-stage1-encrypted
      V46_STAGE1_APPROVAL: EXPIRED_AFTER_INCOMPLETE_PILOT82
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-public-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-public
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-verifier-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-verifier
      - name: Offline checks before any API access
        env:
          V46_SOURCE: /tmp/v46-verifier/independent-requests.json
        run: |
          set -euo pipefail
          node --test tests/next/v14-v46-frozen-receipt.test.mjs tests/next/v14-v46-stage1-capped-api.test.mjs
      - name: Free input token checks, then at most eight one-shot requests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/next/v14-v46-stage1-capped-api.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2a-v46-stage1-api-encrypted-evidence
          path: /tmp/v46-stage1-encrypted
          retention-days: 7
          if-no-files-found: ignore
