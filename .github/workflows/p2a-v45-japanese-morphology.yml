name: P2a-v45 prospective Japanese morphology regression, zero inference
on:
  push:
    branches:
      - feat/coach-p2a-v45-japanese-reversal-lexemes
permissions:
  contents: read
jobs:
  morphology-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test tests/next/v14-v45-japanese-condition.test.mjs
      - run: echo "v45 prospective only. Never amend v44 receipts, no paid API, no model answers."
