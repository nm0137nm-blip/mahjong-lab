name: P2a facts-only preparatory audit
on:
  pull_request:
    branches: [feat/coach-p1-v2-label-recovery-v1]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test tests/next/p2a-facts-only.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-v2-dev-data-*
          run-id: 44726204303
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/p2a-dev
      - run: node tests/next/audit-p2a-facts-only.mjs /tmp/p2a-dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2a-facts-only-preparation
          path: /tmp/p2a-facts-only-audit.json
          if-no-files-found: warn
          retention-days: 30
