name: P2a-v45 read-only verifier source bundle for private local scoring
on:
  push:
    branches:
      - feat/coach-p2a-v45-japanese-reversal-lexemes
    paths:
      - .github/workflows/p2a-v45-readonly-verifier-bundle.yml
permissions:
  contents: read
jobs:
  offline-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Offline source-only packaging - no uploaded user answer, no API requests
        run: |
          set -euo pipefail
          test -f src/coach/v14-v45-stage1-receipt.mjs
          test -f src/coach/v14-v45-evaluation-plan.mjs
          mkdir -p /tmp/v45-verifier-offline
          tar -czf /tmp/v45-verifier-offline/coach-src.tar.gz src/coach package.json
          sha256sum /tmp/v45-verifier-offline/coach-src.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-v45-frozen-verifier-source-only-offline
          path: /tmp/v45-verifier-offline/coach-src.tar.gz
          retention-days: 7
