name: v1.1 historical training and development namespace audit
on:
  pull_request:
    branches: [feat/coach-v11-p1-r1-v1]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: de3cc31944a2b6b68df11b7c553e346874e8bcad
          path: frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 lightgbm==4.6.0 scikit-learn==1.8.0 requests==2.32.5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/tests/next/audit-historical-seeds.py frozen/archive/versions/belief-120-ab-v1/freeze.json
      - uses: actions/upload-artifact@v4
        with:
          name: v11-history-seed-audit
          path: |
            /tmp/seed-history.json
            /tmp/seed-history-public-sha256.json
          if-no-files-found: error
          retention-days: 30
