name: P2a-v47 offline minimal contract and known-case diagnostic preparation
on:
  pull_request:
    branches: [feat/coach-p2a-v46-structured-condition-prototype]
    paths:
      - 'src/coach/v14-minimal-v47.mjs'
      - 'tests/next/v14-v47-minimal.test.mjs'
      - '.github/workflows/p2a-v47-minimal-free.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    if: github.head_ref == 'feat/coach-p2a-v47-minimal-diagnostic'
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/v47-old/independent-requests.json
      V46_SOURCE: /tmp/v47-natural/independent-requests.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v47-old
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-verifier-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v47-natural
      - run: |
          set -euo pipefail
          node --test tests/next/v14-v47-minimal.test.mjs tests/next/v14-structured-condition-v46.test.mjs tests/next/v14-v46-structured-contract.test.mjs tests/next/v14-v45-japanese-condition.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v47-known-exposed-diagnostic-public-only
          path: /tmp/v47-public
          retention-days: 30
