name: P2a-v4.4 Seven GPT-6 Sol API <=USD0.05 per call, strict stop
on:
  push:
    branches:
      - feat/coach-p2a-v44-api-seven-capped
    paths:
      - research/approvals/p2a-v44-api-seven-only-20261124.run
permissions:
  contents: read
  actions: read
concurrency:
  group: mahjong-p2a-v44-exploratory-seven-one-authorized-marker
  cancel-in-progress: false
jobs:
  sequential-seven:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      V14_FOLLOWUP_PUBLIC: /tmp/v44-seven-original36/independent-requests.json
      V14_V44_QUESTIONS_DIR: /tmp/v44-seven-questions/questions
      V44_SEVEN_ENCRYPTED_DIR: /tmp/v44-seven-encrypted
      V44_SEVEN_APPROVAL: SEVEN_AT_MOST_005_20261124
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v2-36-public-development-only
          run-id: 45089922993
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v44-seven-original36
      - uses: actions/download-artifact@v4
        with:
          name: p2a-v44-public-frozen-8-unseen-GPT6-JSON-FILES
          run-id: 45186436930
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v44-seven-questions
      - name: Offline test frozen prompt hashes, 5-cent cap, original verifier and one-time guard
        run: |
          set -euo pipefail
          test -s "$V14_FOLLOWUP_PUBLIC"
          test -s "$V14_V44_QUESTIONS_DIR/pilot-51.json"
          node --test tests/next/v14-v44-seven-capped-api.test.mjs tests/next/v14-v44-api-onecase.test.mjs tests/next/v14-v44-pilot46-single-live-actions.test.mjs
      - name: Run up to seven independent GPT-6 Sol calls; free exact input count before each
        run: |
          set -euo pipefail
          node tests/next/v14-v44-seven-capped-api.mjs
      - name: Archive AES-encrypted originals and sanitized receipts, even on first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-v44-seven-capped-encrypted-evidence
          path: /tmp/v44-seven-encrypted
          retention-days: 7
          if-no-files-found: ignore
      - name: No more model calls are permitted by this approval
        if: always()
        run: echo "Original manual Stage1 unchanged; no retries, no semantic certification."
