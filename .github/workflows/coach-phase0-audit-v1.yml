name: Phase 0 independent S42 and duplicate audit
on:
  pull_request:
    branches: [feat/coach-belief-arena-v1]
    paths:
      - 'tests/phase0/**'
      - 'docs/phase0/**'
      - '.github/workflows/coach-phase0-audit-v1.yml'
      - 'tests/mortal/q-parity*'
      - '.github/workflows/s42-q-parity.yml'
      - 'assets/mortal/**'
      - 'assets/ort/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate fictional event streams and actual deployed WASM observations
        run: node tests/mortal/q-parity-fixtures.mjs /tmp/s42-scenes.json
      - name: Prepare pinned original native reference
        run: |
          git clone https://github.com/Equim-chan/Mortal.git /tmp/Mortal
          git -C /tmp/Mortal checkout 0cff2b52982be5b1163aa9a62fb01f03ce91e0d2
          python -m pip install numpy==2.2.6 onnxruntime==1.21.0
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          cd /tmp/Mortal
          PYO3_PYTHON="$(which python)" cargo build -p libriichi --lib --release --locked
          cp target/release/libriichi.so /tmp/libriichi.so
      - name: Get and verify exact public checkpoints
        run: |
          curl -fL --retry 2 --max-time 240 https://huggingface.co/haor/Mortal-S42/resolve/524981f21a929e3c3b269f65af79b84163bd02ca/weights/s42-inference.pth -o /tmp/s42.pth
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo 'e5f6955b6f19007fd65315e53291b36994493046bc118b991b959e9dc596d660  /tmp/s42.pth' | sha256sum -c -
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
      - name: Compare native feature, masks, original PyTorch and ONNX
        env:
          PYTHONPATH: /tmp
          MORTAL_SOURCE: /tmp/Mortal
          S42_PTH: /tmp/s42.pth
          S42_ONNX: /tmp/s42.onnx
        run: python tests/mortal/q-parity-reference.py /tmp/s42-scenes.json /tmp/s42-q-reference.json
      - name: Preserve fictional reference data only
        uses: actions/upload-artifact@v4
        with:
          name: s42-synthetic-reference
          path: /tmp/s42-q-reference.json
          retention-days: 30
          if-no-files-found: error
          compression-level: 9
  mobile-webkit-parity:
    needs: native-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Official Playwright image contains matching WebKit and its system libraries.
    # No repeated apt downloads on the runner.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: s42-synthetic-reference
          path: /tmp/s42-audit
      - name: Install matching Playwright JS package
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Download verified ONNX only for this job
        run: |
          curl -fL --retry 2 --max-time 240 https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx -o /tmp/s42.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/s42.onnx' | sha256sum -c -
      - name: Compare deployed browser worker against original PyTorch inference
        run: |
          node --input-type=module -e 'import http from "node:http"; import fs from "node:fs"; import path from "node:path"; http.createServer((req,res)=>{const p=path.resolve("."+new URL(req.url,"http://localhost").pathname);if(!p.startsWith(process.cwd()+"/")){res.writeHead(404);res.end();return;} const ext=path.extname(p);res.setHeader("Content-Type",({".mjs":"text/javascript",".js":"text/javascript",".wasm":"application/wasm",".html":"text/html"})[ext]||"application/octet-stream");const stream=fs.createReadStream(p);stream.on("error",()=>{res.statusCode=404;res.end();});stream.pipe(res);}).listen(8765,"127.0.0.1")' >/tmp/s42-audit-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/mortal/q-parity-browser.mjs /tmp/s42.onnx /tmp/s42-audit/s42-q-reference.json

  duplicate-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        first: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic match environment
        run: |
          set -euo pipefail
          mv lab /tmp/lab
          node --check /tmp/lab/tests/arena/run-phase0-duplicate.cjs
          node --test /tmp/lab/tests/mortal-cpu.test.mjs
          curl --fail --location --retry 2 --silent --show-error --max-time 160 'https://huggingface.co/xzhe121/Mortal-S42-onnx/resolve/main/model.onnx' -o /tmp/lab/tests/mortal/model.onnx
          echo '30381bf21389e2d25d3edf48fed11bf772336ef3daeee67d1bdae7fb9dd30cb4  /tmp/lab/tests/mortal/model.onnx' | sha256sum --check
          mkdir -p /tmp/probe && cd /tmp/probe
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          npx playwright install chromium
      - name: Four seats and exact replay
        env:
          COACH_ARENA_QA: '1'
          ARENA_PAIR: ${{ matrix.first }}
        run: |
          set -euo pipefail
          (cd /tmp/lab && python3 -m http.server 8788 --bind 127.0.0.1 >/tmp/http-log 2>&1) &
          sleep 2
          node /tmp/lab/tests/arena/run-phase0-duplicate.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-duplicate-${{ matrix.first }}
          path: /tmp/arena-results/duplicate-*.json
          retention-days: 30
          if-no-files-found: error
  duplicate-gate:
    needs: duplicate-pilot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: phase0-duplicate-*
          path: /tmp/duplicate
      - run: python3 tests/phase0/evaluate_duplicate.py /tmp/duplicate | tee /tmp/phase0-duplicate-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-duplicate-summary
          path: /tmp/phase0-duplicate-summary.json
          retention-days: 30
