name: P2a-v46 locked natural eight receipts and source-only verifier bundle
on:
  push:
    branches: [feat/coach-p2a-v46-structured-condition-prototype]
    paths:
      - '.github/workflows/p2a-v46-frozen-receipt.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      V46_SOURCE: /tmp/v46-verifier/independent-requests.json
      V46_QUESTIONS: /tmp/v46-public/questions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-public-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-public
      - uses: actions/download-artifact@v4
        with:
          name: v46-frozen-eight-verifier-only
          run-id: 45304796606
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v46-verifier
      - run: |
          set -euo pipefail
          node --test tests/next/v14-v46-frozen-receipt.test.mjs
          mkdir -p /tmp/v46-code
          tar -czf /tmp/v46-code/coach-src.tar.gz src/coach
          sha256sum /tmp/v46-code/coach-src.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: v46-locked-receipt-source-only
          path: /tmp/v46-code/coach-src.tar.gz
          retention-days: 30
