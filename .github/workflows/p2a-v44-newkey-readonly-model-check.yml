name: P2a-v4.4 NEW KEY read-only model visibility (no tokens)
on:
  push:
    branches:
      - feat/coach-p2a-v44-api-transport-dryrun
    paths:
      - research/approvals/read-only-model-get-newkey-20261124.run
permissions:
  contents: read
jobs:
  confirm-new-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Run GET-only tests
        run: node --test tests/next/v14-v44-free-model-readcheck.test.mjs
      - name: Authenticate with newly registered GitHub Secret and fetch model metadata once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tests/next/v14-v44-free-model-readcheck.mjs
