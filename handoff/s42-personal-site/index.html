<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>麻雀LAB 個人用 S42</title><style>body{margin:auto;max-width:36rem;padding:32px 20px;background:#102e2c;color:#f7f4e6;font:16px/1.7 system-ui,sans-serif}button,textarea{font:inherit}button{padding:12px 16px;background:#c4e988;color:#153326;border:0;border-radius:8px}textarea{box-sizing:border-box;width:100%;padding:8px;min-height:80px}small{color:#b9d0c7}a{color:#c4e988}</style><h1>麻雀LAB 個人用先行版 v2</h1><p>Mortal S42 × 3 / 端末内推論</p><p id="status" role="status">準備中…</p><form id="unlock" hidden><label for="key">個人用の鍵</label><textarea id="key" autocomplete="off" autocapitalize="off" spellcheck="false" required></textarea><button type="submit">開く</button></form><p><small>初回の暗号化資材取得には通信が必要です。鍵を持つ端末だけが復号できます。鍵付きURLは他人に共有しないでください。端末内の保存が消えた場合は鍵付きURLを開き直してください。</small></p><button id="lock" hidden>この端末のアクセス鍵を削除</button><script type="module">
const status=document.querySelector('#status'),form=document.querySelector('#unlock'),key=document.querySelector('#key'),lock=document.querySelector('#lock');
const fragment=new URLSearchParams(location.hash.slice(1)).get('key');
let worker;
function rpc(kind,value){return new Promise((resolve,reject)=>{const c=new MessageChannel();const timer=setTimeout(()=>{c.port1.close();reject(Error('応答待ちの時間を超えました'));},30000);c.port1.onmessage=e=>{clearTimeout(timer);c.port1.close();e.data?.ok?resolve(e.data):reject(Error(e.data?.error||'解除できませんでした'));};worker.postMessage({kind,value},[c.port2]);});}
async function activate(){if(!('serviceWorker'in navigator)||!crypto.subtle)throw Error('HTTPSでSafariまたはChromeを使用してください');const r=await navigator.serviceWorker.register('./unlock-sw.js',{scope:'./',updateViaCache:'none'});for(let i=0;i<300;i++){if(r.active?.state==='activated')return r.active;await new Promise(x=>setTimeout(x,100));}throw Error('ローカル配布の起動に失敗しました');}
async function open(value){status.textContent='暗号化したゲームを確認中…';await rpc('unlock',value.trim());history.replaceState(null,'',location.pathname);key.value='';location.replace('./app/index.html');}
form.addEventListener('submit',async e=>{e.preventDefault();try{await open(key.value);}catch(e){status.textContent='開けませんでした：'+e.message;form.hidden=false;}});
lock.addEventListener('click',async()=>{await rpc('lock');status.textContent='アクセス鍵を削除しました';form.hidden=false;lock.hidden=true;});
try{worker=await activate();if(fragment){history.replaceState(null,'',location.pathname);await open(fragment);}else if((await rpc('status')).unlocked){location.replace('./app/index.html');}else{status.textContent='鍵付きURLまたは鍵が必要です';form.hidden=false;}}catch(e){status.textContent='起動できません：'+e.message;form.hidden=false;}
</script></html>
