<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀LAB 計算トレーニング</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;line-height:1.65}body{margin:0;padding:18px;max-width:680px;margin-inline:auto}h1{font-size:1.5rem}h2{font-size:1.15rem}button,select,input,textarea{font:inherit;padding:.55rem;max-width:100%;box-sizing:border-box}button{cursor:pointer}label{display:block;margin:.7rem 0 .2rem}textarea{width:100%;resize:vertical}input,select{width:100%}section{margin:1rem 0;padding:1rem;border:1px solid #888;border-radius:12px}p{overflow-wrap:anywhere}.muted{opacity:.8}button{margin:.35rem .3rem .35rem 0}article{padding:.5rem 0;border-bottom:1px solid #888} [hidden]{display:none!important}
</style></head><body><a href="index.html">麻雀LABへ戻る</a><h1>着順・段位pt 計算トレーニング</h1>
<p>正確な算術の練習です。実際の牌譜やS42の推奨手を正解にするものではありません。仮定の順位確率は実戦予測ではありません。</p>
<section id="setup"><h2>問題セット</h2><p>最初の12問は基準測定、次の12問は別の例での練習です。厳密な学習効果の検証や独立した実戦評価ではありません。</p><button id="startBase">基準測定（12問）</button><button id="startTransfer">別問題（12問）</button><p class="muted">途中結果は端末内の画面だけに保持します。閉じると失われます。完了後にJSONを保存できます。</p></section>
<section id="question" hidden><h2 id="progress"></h2><p id="prompt"></p><form id="form"><label for="answer">回答（<span id="unit"></span>）</label><input id="answer" type="number" step="any" required inputmode="decimal"><label for="confidence">自信度（1〜5）</label><select id="confidence" required><option value="">選択</option><option value="1">1：低い</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5：高い</option></select><label for="reason">根拠・見落とし（任意）</label><textarea id="reason" maxlength="1000" rows="3"></textarea><button type="submit" id="submit">回答を確定</button></form><p id="error" role="status"></p><p class="muted">全問確定後に正解を表示します。回答後の変更はできません。所要時間は参考記録です。</p></section>
<section id="result" hidden><h2>結果</h2><p id="summary"></p><div id="reviews"></div><button id="export">結果JSONを保存</button><button id="again">問題セット選択へ</button></section>
<script type="module">
import {createTrainingSession} from './src/research/training-core.mjs';
const $=id=>document.getElementById(id);let session,questions,index,started,done;
function begin(group){session=createTrainingSession(group);questions=session.questions();index=0;done=null;$('setup').hidden=true;$('result').hidden=true;$('question').hidden=false;show();}
function show(){const q=questions[index];$('progress').textContent=(index+1)+' / '+questions.length;$('prompt').textContent=q.prompt;$('unit').textContent=q.unit;$('form').reset();$('error').textContent='';started=performance.now();$('answer').focus();}
function finish(){done=session.summary();$('question').hidden=true;$('result').hidden=false;$('summary').textContent=done.correct+' / '+done.total+' 正解（確定計算のみ）';const root=$('reviews');root.replaceChildren();for(const r of done.responses){const q=questions.find(x=>x.id===r.id),a=document.createElement('article'),p=document.createElement('p'),v=document.createElement('p');p.textContent=q.prompt;v.textContent=(r.correct?'正解':'不正解')+'｜回答 '+r.value+'、正解 '+r.answer+' '+q.unit+'｜自信 '+r.confidence+'/5｜'+(r.elapsedMs/1000).toFixed(1)+'秒';a.append(p,v);if(r.reason){const n=document.createElement('p');n.textContent='回答根拠：'+r.reason;a.append(n);}root.append(a);}}
$('startBase').onclick=()=>begin('baseline');$('startTransfer').onclick=()=>begin('transfer');
$('form').addEventListener('submit',e=>{e.preventDefault();try{if(!$('form').reportValidity())return;session.submit(questions[index].id,Number($('answer').value),Number($('confidence').value),Math.round(performance.now()-started),$('reason').value);index++;if(index===questions.length)finish();else show();}catch(e){$('error').textContent='入力を確認してください。';}});
$('export').onclick=()=>{if(!done)return;const u=URL.createObjectURL(new Blob([JSON.stringify({schema:'mahjong-lab-calculation-training-v1',...done},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='mahjong-calculation-'+done.group+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('again').onclick=()=>{$('result').hidden=true;$('setup').hidden=false;session=null;done=null;};
</script></body></html>
